<style>

  .kpi .l{color:#a9bce0;font-size:10.5px;margin-top:4px;text-transform:uppercase;letter-spacing:.4px}
  .kpi .v.g{color:#5ce68f}.kpi .v.a{color:#ffcd6b}.kpi .v.r{color:#ff8f8f}

<script>
"use strict";
(function(){
  const $ = (s,r=document)=>r.querySelector(s);
  const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
  const fmt = n => (n||0).toLocaleString('en-IN');
  const pct = (n,d)=> d? (100*n/d):0;
  const p1 = n => (n||0).toFixed(1)+'%';

  const SUM=['totalVoters','mpVoted','sirSubmitted','delTotal','permShifted','untraceable','efRefused','death','enrolledElsewhere'];
  function agg(rows){const t={};SUM.forEach(k=>t[k]=0);for(const r of rows)for(const k of SUM)t[k]+=r[k]||0;
    t.count=rows.length;
    t.coverage=pct(t.sirSubmitted,t.mpVoted);
    t.digitized=pct(t.sirSubmitted,t.totalVoters);
    t.deletion=pct(t.delTotal,t.totalVoters);
    t.turnout=pct(t.mpVoted,t.totalVoters);
    t.notSubmitted=t.totalVoters-t.sirSubmitted;
    t.votedGap=t.mpVoted-t.sirSubmitted;
    return t;}

  const covBand=c=> c>=100?'g':c>=90?'a':'r';
  const digBand=d=> d>=55?'g':d>=45?'a':'r';

  // ---- state ----
  let DATA=null, BOOTHS=[];
  const st={level:'assembly',mandal:null,ward:null,filter:'All',search:'',sortKey:'booth',sortDir:1};

  function scopeBooths(){
    let b=BOOTHS;
    if(st.filter!=='All' && st.level==='assembly') b=b.filter(x=>x.mandal===st.filter);
    if(st.mandal) b=b.filter(x=>x.mandal===st.mandal);
    if(st.ward) b=b.filter(x=>x.ward===st.ward);
    return b;
  }

  // ---- charts ----
  function areaChart(labels, sA, sB, nameA, nameB, colA, colB){
    const W=560,H=210,pl=44,pr=12,pt=14,pb=26,n=labels.length;
    const max=Math.max(1,...sA,...sB);
    const x=i=> n<=1? pl+(W-pl-pr)/2 : pl+i*(W-pl-pr)/(n-1);
    const y=v=> H-pb-(v/max)*(H-pt-pb);
    const line=s=>s.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    const areaPath=s=>`M ${x(0)},${H-pb} `+s.map((v,i)=>`L ${x(i)},${y(v)}`).join(' ')+` L ${x(n-1)},${H-pb} Z`;
    // gap polygon between B(top) and A(bottom) where B>=A
    let gap=`M `+sB.map((v,i)=>`${x(i)},${y(v)} `).join('L ')+' ';
    for(let i=n-1;i>=0;i--) gap+=`L ${x(i)},${y(sA[i])} `;
    gap+='Z';
    const grid=[0,.5,1].map(f=>{const gy=y(max*f);return `<line x1="${pl}" y1="${gy}" x2="${W-pr}" y2="${gy}" stroke="#eee3d0" stroke-width="1"/><text x="${pl-6}" y="${gy+3}" text-anchor="end" font-size="9" fill="#93a0b5">${fmt(Math.round(max*f))}</text>`}).join('');
    const dots=(s,col)=>s.map((v,i)=>`<circle class="dot" cx="${x(i)}" cy="${y(v)}" r="3.4" fill="${col}" data-i="${i}"/>`).join('');
    const xlab= n<=14? labels.map((l,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="#93a0b5">${esc(String(l).slice(0,7))}</text>`).join(''):'';
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">
      ${grid}
      <path d="${gap}" fill="${colB}" opacity=".16"/>
      <path d="${areaPath(sB)}" fill="${colB}" opacity=".10"/>
      <polyline points="${line(sB)}" fill="none" stroke="${colB}" stroke-width="2"/>
      <path d="${areaPath(sA)}" fill="${colA}" opacity=".16"/>
      <polyline points="${line(sA)}" fill="none" stroke="${colA}" stroke-width="2.4"/>
      ${dots(sB,colB)}${dots(sA,colA)}${xlab}
    </svg>`;
  }

  function stackBar(t){
    const segs=[
      ['Permanently Shifted',t.permShifted,'#2563a8'],
      ['Untraceable / Absent',t.untraceable,'#c67c05'],
      ['EF Refused',t.efRefused,'#7c5cbf'],
      ['Death',t.death,'#cf2b2b'],
      ['Enrolled Elsewhere',t.enrolledElsewhere,'#158a4a'],
    ];
    const tot=Math.max(1,t.delTotal);
    const bar=segs.map(([nm,v,c])=>`<span title="${esc(nm)}: ${fmt(v)}" style="width:${100*v/tot}%;background:${c}"></span>`).join('');
    const leg=segs.map(([nm,v,c])=>`<span><b style="background:${c}"></b>${esc(nm)} — ${fmt(v)} (${p1(pct(v,tot))})</span>`).join('');
    const cells=segs.map(([nm,v,c])=>`<div class="delcell"><div class="dv" style="color:${c}">${fmt(v)}</div><div class="dl">${esc(nm)}</div><div class="dp">${p1(pct(v,tot))}</div></div>`).join('');
    return `<div class="stack">${bar}</div><div class="legend">${leg}</div><div class="delgrid">${cells}</div>`;
  }

  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ---- children grouping ----
  function children(){
    const b=scopeBooths();
    if(st.level==='assembly'){
      const ms=st.filter==='All'?DATA.meta.mandals:[st.filter];
      return ms.map(m=>({key:m,name:m+' Mandala',type:'mandala',rows:b.filter(x=>x.mandal===m)}))
               .filter(c=>c.rows.length);
    }
    if(st.level==='mandala'){
      const wm=new Map();
      for(const x of b){if(!wm.has(x.ward))wm.set(x.ward,[]);wm.get(x.ward).push(x);}
      return [...wm.entries()].sort((a,z)=>a[0].localeCompare(z[0]))
        .map(([w,rows])=>({key:w,name:w,type:'ward',rows}));
    }
    return []; // ward level -> booth table
  }

  // ---- render ----
  function render(){
    const b=scopeBooths(), t=agg(b);
    renderCrumbs(); $('#back').disabled = st.level==='assembly';
    // filter seg only meaningful at assembly
    [...$('#mandalFilter').children].forEach(x=>x.classList.toggle('on',x.dataset.f===st.filter));
    $('#mandalFilter').style.opacity = st.level==='assembly'?1:.45;
    $('#mandalFilter').style.pointerEvents = st.level==='assembly'?'auto':'none';

    const scopeName = st.level==='assembly'?(st.filter==='All'?'AC-174 Mahadevapura':st.filter+' Mandala')
                     : st.level==='mandala'? st.mandal+' Mandala' : st.ward+' — Ward';
    const scopeMeta = st.level==='ward'
      ? `${t.count} booths · ${fmt(t.totalVoters)} voters`
      : `${t.count} booths · ${new Set(b.map(x=>x.ward)).size} wards · ${fmt(t.totalVoters)} voters`;

    const kpi=(v,l,cls='')=>`<div class="kpi"><div class="v ${cls}">${v}</div><div class="l">${l}</div></div>`;
    const strip=`<div class="kpis">
      ${kpi(fmt(t.totalVoters),'Total Voters')}
      ${kpi(fmt(t.mpVoted),'MP Voted 2024')}
      ${kpi(fmt(t.sirSubmitted),'SIR Submitted')}
      ${kpi(fmt(t.delTotal),'SIR Delete Total')}
      ${kpi(fmt(t.notSubmitted),'Not Yet Submitted')}
      ${kpi(p1(t.coverage),'Coverage %',covBand(t.coverage))}
      ${kpi(p1(t.digitized),'Digitized %',digBand(t.digitized))}
    </div>`;

    const cb=covBand(t.coverage), db=digBand(t.digitized);
    const big=`<div class="bigrow">
      <div class="big"><div class="cap">Coverage % · SIR Submitted / MP Voted 2024</div>
        <div class="num ${cb}">${p1(t.coverage)}</div>
        <div class="den">${fmt(t.sirSubmitted)} submitted vs ${fmt(t.mpVoted)} who voted in 2024</div>
        <div class="prog"><i class="${cb}" style="width:${Math.min(100,t.coverage)}%"></i></div></div>
      <div class="big"><div class="cap">Digitized % · SIR Submitted / Total Voters</div>
        <div class="num ${db}">${p1(t.digitized)}</div>
        <div class="den">${fmt(t.sirSubmitted)} submitted of ${fmt(t.totalVoters)} total voters</div>
        <div class="prog"><i class="${db}" style="width:${Math.min(100,t.digitized)}%"></i></div></div>
    </div>`;

    // charts across children (or booths at ward level)
    const chItems = st.level==='ward'
      ? [...b].sort((a,z)=>a.booth-z.booth).map(x=>({name:'#'+x.booth,rows:[x]}))
      : children();
    const labels=chItems.map(c=>c.name);
    const aggs=chItems.map(c=>agg(c.rows));
    const voted=aggs.map(a=>a.mpVoted), sub=aggs.map(a=>a.sirSubmitted), tot=aggs.map(a=>a.totalVoters);
    const chartLabel = st.level==='ward'?'booths':(st.level==='assembly'?'mandalas':'wards');

    const gapCallout = t.votedGap>0
      ? `<div class="callout">▲ ${fmt(t.votedGap)} voted in 2024 with no SIR form yet</div>`
      : `<div class="callout" style="background:var(--green-bg);color:var(--green);border-color:#bfe6cd">✓ All ${fmt(t.mpVoted)} of the 2024 voters covered${t.votedGap<0?` (+${fmt(-t.votedGap)} beyond)`:''}</div>`;
    const subCallout = t.notSubmitted>0
      ? `<div class="callout" style="background:var(--amber-bg);color:var(--amber);border-color:#f0dca6">◱ ${fmt(t.notSubmitted)} of ${fmt(t.totalVoters)} not yet submitted</div>`
      : `<div class="callout" style="background:var(--green-bg);color:var(--green);border-color:#bfe6cd">✓ All ${fmt(t.totalVoters)} voters submitted</div>`;
    const panels=`<div class="panels">
      <div class="panel"><h3>Voted-No-EF gap</h3><div class="hint">MP Voted 2024 (navy) vs SIR Submitted (green) across ${chItems.length} ${chartLabel}; shaded = gap</div>
        ${areaChart(labels,sub,voted,'SIR Submitted','MP Voted','#158a4a','#12294d')}
        ${gapCallout}
        <div class="legend"><span><b style="background:#12294d"></b>MP Voted 2024</span><span><b style="background:#158a4a"></b>SIR Submitted</span></div>
      </div>
      <div class="panel"><h3>Not-yet-submitted</h3><div class="hint">Total Voters (blue) vs SIR Submitted (green) across ${chItems.length} ${chartLabel}; shaded = pending</div>
        ${areaChart(labels,sub,tot,'SIR Submitted','Total Voters','#158a4a','#2563a8')}
        ${subCallout}
        <div class="legend"><span><b style="background:#2563a8"></b>Total Voters</span><span><b style="background:#158a4a"></b>SIR Submitted</span></div>
      </div>
    </div>`;

    const del=`<div class="panel" style="margin-bottom:16px"><h3>Deletion breakdown</h3>
      <div class="hint">${fmt(t.delTotal)} deletions = ${p1(t.deletion)} of total voters</div>${stackBar(t)}</div>`;

    let childSection='';
    if(st.level==='ward'){
      childSection=boothTable(b);
    }else{
      const cs=children();
      childSection=`<div class="sect"><h3>${st.level==='assembly'?'Mandalas':'Wards'} <span style="color:var(--ink-3);font-weight:600">(${cs.length})</span></h3></div>`+cardGrid(cs);
    }

    $('#app').innerHTML = `<h2 class="scope">${esc(scopeName)}</h2><div class="scope-meta">${scopeMeta}</div>`
      + strip + big + panels + del + childSection;

    wireDots(chItems);
    if(st.level==='ward') wireTable(); else wireCards();
    $('#foot').textContent = `AC-174 Mahadevapura · ${DATA.meta.boothCount} booths · Coverage = SIR Submitted ÷ MP Voted 2024 · Digitized = SIR Submitted ÷ Total Voters · data embedded, works offline`;
  }

  function cardGrid(cs){
    return `<div class="cards">`+cs.map(c=>{
      const a=agg(c.rows), cb=covBand(a.coverage);
      return `<button class="ccard" data-key="${esc(c.key)}" data-type="${c.type}">
        <div class="ch"><span class="nm">${esc(c.name)}</span><span class="mb">${a.count} booths</span></div>
        <div class="cb">
          <div class="cov"><span class="n ${cb}">${p1(a.coverage)}</span><span class="t">COVERAGE</span></div>
          <div class="prog" style="margin-top:8px"><i class="${cb}" style="width:${Math.min(100,a.coverage)}%"></i></div>
          <div class="mini">
            <div><b>${fmt(a.totalVoters)}</b><span>total voters</span></div>
            <div><b>${fmt(a.sirSubmitted)}</b><span>submitted</span></div>
            <div><b class="">${p1(a.digitized)}</b><span>digitized</span></div>
            <div><b>${fmt(a.delTotal)}</b><span>deletions</span></div>
          </div>
          <div class="gapbox ${a.votedGap<=0?'zero':''}">${a.votedGap>0?('▲ '+fmt(a.votedGap)+' voted, no EF yet'):('✓ all 2024 voters covered')}</div>
        </div></button>`;
    }).join('')+`</div>`;
  }

  const COLS=[
    ['booth','Booth',0],['ward','Ward',0],['totalVoters','Total',1],['mpVoted','MP Voted',1],
    ['sirSubmitted','Submitted',1],['delTotal','Deletions',1],['notSubmitted','Not Sub.',1],
    ['coverage','Cov %',1],['digitized','Dig %',1]
  ];
  function boothRowVals(x){const a=agg([x]);return {booth:x.booth,ward:x.ward,totalVoters:x.totalVoters,mpVoted:x.mpVoted,
    sirSubmitted:x.sirSubmitted,delTotal:x.delTotal,notSubmitted:a.notSubmitted,coverage:a.coverage,digitized:a.digitized,_x:x};}
  function boothTable(b){
    let rows=b.map(boothRowVals);
    rows.sort((p,q)=>{const d=(p[st.sortKey]>q[st.sortKey]?1:p[st.sortKey]<q[st.sortKey]?-1:0);return d*st.sortDir;});
    const head=COLS.map(([k,l,r])=>`<th class="${r?'r':''}" data-k="${k}">${l}${st.sortKey===k?`<span class="ar">${st.sortDir>0?'▲':'▼'}</span>`:''}</th>`).join('');
    const body=rows.map(v=>{
      const cb=covBand(v.coverage),db=digBand(v.digitized);
      return `<tr data-booth="${v.booth}">
        <td class="strong">#${v.booth}</td><td>${esc(v.ward)}</td>
        <td class="r">${fmt(v.totalVoters)}</td><td class="r">${fmt(v.mpVoted)}</td>
        <td class="r">${fmt(v.sirSubmitted)}</td><td class="r">${fmt(v.delTotal)}</td><td class="r">${fmt(v.notSubmitted)}</td>
        <td class="r"><span class="pill ${cb}">${p1(v.coverage)}</span></td>
        <td class="r"><span class="pill ${db}">${p1(v.digitized)}</span></td></tr>`;
    }).join('');
    return `<div class="sect"><h3>Booths <span style="color:var(--ink-3);font-weight:600">(${rows.length})</span></h3></div>
      <div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  }

  // ---- interaction ----
  function wireCards(){
    document.querySelectorAll('.ccard').forEach(c=>c.addEventListener('click',()=>{
      const key=c.dataset.key,type=c.dataset.type;
      if(type==='mandala'){st.level='mandala';st.mandal=key;st.ward=null;}
      else if(type==='ward'){st.level='ward';st.ward=key;}
      window.scrollTo(0,0);render();
    }));
  }
  function wireTable(){
    document.querySelectorAll('th[data-k]').forEach(h=>h.addEventListener('click',()=>{
      const k=h.dataset.k; if(st.sortKey===k)st.sortDir*=-1;else{st.sortKey=k;st.sortDir=1;} render();
    }));
    document.querySelectorAll('tr[data-booth]').forEach(r=>r.addEventListener('click',()=>{
      openBooth(+r.dataset.booth);
    }));
  }
  function wireDots(items){
    const tip=$('#tip');
    document.querySelectorAll('.dot').forEach(d=>{
      d.addEventListener('mousemove',e=>{
        const i=+d.dataset.i, a=agg(items[i].rows);
        tip.innerHTML=`<b>${esc(items[i].name)}</b><br>Voted ${fmt(a.mpVoted)} · Sub ${fmt(a.sirSubmitted)} · Total ${fmt(a.totalVoters)}`;
        tip.style.opacity=1;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-10)+'px';
      });
      d.addEventListener('mouseleave',()=>tip.style.opacity=0);
    });
  }
  function openBooth(n){
    const x=BOOTHS.find(z=>z.booth===n); if(!x)return; const a=agg([x]);
    const cb=covBand(a.coverage),db=digBand(a.digitized);
    const del=[['Permanently Shifted',x.permShifted],['Untraceable / Absent',x.untraceable],['EF Refused',x.efRefused],['Death',x.death],['Enrolled Elsewhere',x.enrolledElsewhere]];
    const ov=el('div','ov');
    ov.innerHTML=`<div class="modal"><div class="mh"><div><div class="e">${esc(x.mandal)} · ${esc(x.ward)} ward</div><h3>Booth ${x.booth}</h3></div><button class="xbtn" aria-label="Close">✕</button></div>
      <div class="mbody">
        <div class="bigrow" style="margin-bottom:14px">
          <div class="big" style="padding:14px"><div class="cap">Coverage</div><div class="num ${cb}" style="font-size:34px">${p1(a.coverage)}</div><div class="prog"><i class="${cb}" style="width:${Math.min(100,a.coverage)}%"></i></div></div>
          <div class="big" style="padding:14px"><div class="cap">Digitized</div><div class="num ${db}" style="font-size:34px">${p1(a.digitized)}</div><div class="prog"><i class="${db}" style="width:${Math.min(100,a.digitized)}%"></i></div></div>
        </div>
        <div class="delgrid">
          <div class="delcell"><div class="dv">${fmt(x.totalVoters)}</div><div class="dl">Total Voters</div></div>
          <div class="delcell"><div class="dv">${fmt(x.mpVoted)}</div><div class="dl">MP Voted 2024</div><div class="dp">${p1(a.turnout)} turnout</div></div>
          <div class="delcell"><div class="dv">${fmt(x.sirSubmitted)}</div><div class="dl">SIR Submitted</div></div>
          <div class="delcell"><div class="dv">${fmt(a.notSubmitted)}</div><div class="dl">Not Yet Submitted</div></div>
        </div>
        <h3 style="font-size:13.5px;margin:16px 0 8px">Deletion breakdown — ${fmt(x.delTotal)} (${p1(a.deletion)})</h3>
        <div class="delgrid">${del.map(([l,v])=>`<div class="delcell"><div class="dv">${fmt(v)}</div><div class="dl">${l}</div><div class="dp">${p1(pct(v,x.delTotal||1))}</div></div>`).join('')}</div>
      </div></div>`;
    const close=()=>ov.remove();
    ov.addEventListener('click',e=>{if(e.target===ov)close();});
    ov.querySelector('.xbtn').addEventListener('click',close);
    document.addEventListener('keydown',function esc2(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc2);}});
    document.body.appendChild(ov);
  }

  function renderCrumbs(){
    const c=$('#crumbs');const parts=[['Assembly',()=>{st.level='assembly';st.mandal=null;st.ward=null;}]];
    if(st.mandal)parts.push([st.mandal+' Mandala',()=>{st.level='mandala';st.ward=null;}]);
    if(st.ward)parts.push([st.ward+' Ward',null]);
    c.innerHTML='';
    parts.forEach(([label,fn],i)=>{
      if(i)c.appendChild(el('span',null,'/'));
      const btn=el('button',fn?'':'cur',esc(label));
      if(fn)btn.addEventListener('click',()=>{fn();render();});
      c.appendChild(btn);
    });
  }

  function goBack(){
    if(st.level==='ward'){st.level='mandala';st.ward=null;}
    else if(st.level==='mandala'){st.level='assembly';st.mandal=null;}
    render();
  }

  function applySearch(q){
    q=q.trim().toLowerCase(); if(!q)return;
    // booth number?
    if(/^\d+$/.test(q)){const x=BOOTHS.find(z=>z.booth===+q); if(x){st.level='ward';st.mandal=x.mandal;st.ward=x.ward;render();setTimeout(()=>openBooth(x.booth),50);return;}}
    // ward name
    const hit=BOOTHS.find(z=>z.ward.toLowerCase().includes(q));
    if(hit){st.level='mandala';st.mandal=hit.mandal;st.ward=null;render();
      // then drill to ward
      st.level='ward';st.ward=hit.ward;render();}
  }

  // ---- boot ----
  async function loadData(){
    // Prefer external JSON (hosted, editable without touching HTML); fall back to
    // the embedded blob so the file also works offline via double-click (file://).
    try{const r=await fetch('./data/ac174.json',{cache:'no-store'});if(r.ok)return await r.json();}catch(e){}
    const inline=$('#ac174-data').textContent.trim();
    if(inline && inline!=='null')return JSON.parse(inline);
    throw new Error('No data: expected ./data/ac174.json or embedded data.');
  }

  loadData().then(d=>{
    DATA=d;BOOTHS=d.booths;
    $('#title').textContent=d.meta.title;$('#subtitle').textContent=d.meta.subtitle;$('#dateBadge').textContent=d.meta.dateBadge;
    document.title=d.meta.subtitle;
    $('#back').addEventListener('click',goBack);
    $('#mandalFilter').addEventListener('click',e=>{const f=e.target.dataset.f;if(f){st.filter=f;render();}});
    let timer;$('#search').addEventListener('input',e=>{clearTimeout(timer);const v=e.target.value;timer=setTimeout(()=>applySearch(v),350);});
    render();
  }).catch(err=>{
    $('#app').innerHTML=`<div class="err"><b>Could not load data.</b><br>${esc(err.message)}<br><br>If hosting, ensure <code>data/ac174.json</code> sits next to this file and is served over HTTP. If opening offline, use the single-file <code>AC174_SIR_Dashboard.html</code> (data embedded).</div>`;
  });
})();
</script>
</body>
</html>
