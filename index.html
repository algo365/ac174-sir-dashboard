<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AC-174 Mahadevapura — SIR 2026 vs MP 2024 Voters</title>
<style>
  :root{
    --paper:#f4efe6; --paper2:#ece4d6;
    --navy:#12294d; --navy-2:#1c3a66; --navy-ink:#e8eefb;
    --card:#ffffff; --border:#e3dccd; --border-2:#d8cfbc;
    --ink:#1b2436; --ink-2:#54607a; --ink-3:#93a0b5;
    --green:#158a4a; --green-bg:#dff3e6;
    --amber:#c67c05; --amber-bg:#fbedcf;
    --red:#cf2b2b; --red-bg:#fbe0e0;
    --blue:#2563a8; --purple:#7c5cbf; --teal:#0d9488;
    --r-sm:8px; --r-md:12px; --r-lg:16px;
    --sh-sm:0 1px 2px rgba(18,41,77,.06);
    --sh-md:0 2px 4px rgba(18,41,77,.06),0 8px 20px rgba(18,41,77,.06);
    --ease:cubic-bezier(.4,0,.2,1);
    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  body{padding-bottom:40px}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:1220px;margin:0 auto;padding:clamp(14px,3vw,26px)}

  header.top{background:linear-gradient(120deg,var(--navy),var(--navy-2));color:#fff}
  .top-inner{max-width:1220px;margin:0 auto;padding:clamp(16px,3vw,26px) clamp(14px,3vw,26px);
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .top h1{font-size:clamp(18px,3vw,25px);font-weight:800;letter-spacing:-.01em;line-height:1.15}
  .top .sub{color:#b9c8e6;font-size:clamp(12px,2vw,14px);margin-top:4px}
  .date-badge{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
    color:#fff;font-weight:700;font-size:12px;padding:8px 12px;border-radius:999px;white-space:nowrap}

  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 8px}
  .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;flex:1;min-width:180px}
  .crumbs button{background:none;border:none;color:var(--ink-2);padding:5px 8px;border-radius:7px;font-size:13px}
  .crumbs button:hover{background:#fff;color:var(--navy)}
  .crumbs button.cur{color:var(--ink);font-weight:800;cursor:default}
  .crumbs span{color:var(--ink-3)}
  .back{background:#fff;border:1px solid var(--border);color:var(--navy);font-weight:700;
    padding:8px 14px;border-radius:var(--r-sm);font-size:13px;box-shadow:var(--sh-sm)}
  .back:hover{background:var(--paper2)} .back[disabled]{opacity:.4;cursor:not-allowed}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--border);border-radius:var(--r-sm);padding:3px;box-shadow:var(--sh-sm)}
  .seg button{border:none;background:none;padding:7px 12px;border-radius:6px;font-size:13px;color:var(--ink-2);font-weight:600}
  .seg button.on{background:var(--navy);color:#fff}
  .search{border:1px solid var(--border);background:#fff;border-radius:var(--r-sm);padding:9px 12px;
    font-size:13px;min-width:150px;color:var(--ink);box-shadow:var(--sh-sm)}
  .search:focus{outline:2px solid var(--blue);outline-offset:1px}

  h2.scope{font-size:clamp(18px,3vw,23px);font-weight:800;margin:6px 0 2px}
  .scope-meta{color:var(--ink-2);font-size:13px;margin-bottom:14px}
  .prez{display:inline-block;background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;
    padding:3px 10px;border-radius:999px;margin-left:8px}
  .srlist{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  .sr{text-align:left;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px 13px;box-shadow:var(--sh-sm);display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13px}
  .sr:hover{border-color:var(--navy-2);background:#faf7f1}
  .sr .dim{color:var(--ink-3);font-size:11.5px;font-weight:600}

  .kpis{background:linear-gradient(120deg,var(--navy),var(--navy-2));border-radius:var(--r-lg);
    padding:16px;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;box-shadow:var(--sh-md);margin-bottom:16px}
  .kpi{padding:8px 10px;border-right:1px solid rgba(255,255,255,.10)}
  .kpi:last-child{border-right:none}
  .kpi .v{color:#fff;font-size:clamp(15px,2.4vw,21px);font-weight:800;line-height:1.1}
  .kpi .l{color:#a9bce0;font-size:10.5px;margin-top:4px;text-transform:uppercase;letter-spacing:.4px}
  .kpi .v.g{color:#5ce68f}.kpi .v.a{color:#ffcd6b}.kpi .v.r{color:#ff8f8f}

  .bigrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  .big{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh-sm)}
  .big .cap{font-size:12.5px;color:var(--ink-2);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .big .num{font-size:clamp(34px,7vw,52px);font-weight:800;line-height:1;margin:6px 0 4px}
  .big .num.g{color:var(--green)}.big .num.a{color:var(--amber)}.big .num.r{color:var(--red)}
  .big .den{font-size:12.5px;color:var(--ink-3);margin-bottom:12px}
  .prog{height:10px;background:var(--paper2);border-radius:999px;overflow:hidden}
  .prog > i{display:block;height:100%;border-radius:999px}
  .prog > i.g{background:var(--green)}.prog > i.a{background:var(--amber)}.prog > i.r{background:var(--red)}

  .panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-sm)}
  .panel h3{font-size:13.5px;font-weight:800;margin-bottom:2px}
  .panel .hint{font-size:11.5px;color:var(--ink-3);margin-bottom:10px}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;font-size:12px;color:var(--ink-2)}
  .legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
  .callout{display:inline-flex;align-items:center;gap:8px;background:var(--red-bg);color:var(--red);
    border:1px solid #f3caca;border-radius:var(--r-sm);padding:8px 12px;font-size:12.5px;font-weight:700;margin-top:12px}

  svg.chart{width:100%;height:auto;display:block;overflow:visible}
  .dot{cursor:pointer}
  .tip{position:fixed;pointer-events:none;background:var(--navy);color:#fff;font-size:12px;
    padding:7px 10px;border-radius:8px;box-shadow:var(--sh-md);opacity:0;transition:opacity .1s;z-index:60;white-space:nowrap}

  /* composition stacked bar */
  .comp{display:flex;height:22px;border-radius:7px;overflow:hidden;border:1px solid var(--border);margin:4px 0}
  .comp > span{display:block;min-width:0}
  .delgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px}
  .delcell{border:1px solid var(--border);border-radius:var(--r-sm);padding:10px}
  .delcell .dv{font-size:17px;font-weight:800}.delcell .dl{font-size:11px;color:var(--ink-2);margin-top:2px}
  .delcell .dp{font-size:11px;color:var(--ink-3);font-weight:700}

  .sect{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px;flex-wrap:wrap;gap:8px}
  .sect h3{font-size:15px;font-weight:800}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .ccard{text-align:left;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);
    box-shadow:var(--sh-sm);overflow:hidden;transition:transform .12s var(--ease),box-shadow .12s var(--ease),border-color .12s;width:100%}
  .ccard:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--navy-2)}
  .ccard:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .ccard .ch{background:linear-gradient(120deg,var(--navy),var(--navy-2));color:#fff;
    padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .ccard .ch .nm{font-weight:800;font-size:15px}
  .ccard .ch .mb{font-size:11px;color:#b9c8e6;white-space:nowrap}
  .ccard .cb{padding:14px}
  .hl2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .hl{border-radius:10px;padding:9px 11px}
  .hl.sub{background:var(--green-bg)} .hl.del{background:var(--red-bg)}
  .hl .n{font-size:22px;font-weight:800;line-height:1}
  .hl.sub .n{color:var(--green)} .hl.del .n{color:var(--red)}
  .hl .t{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-2);margin-top:3px}
  .hl .p{font-size:11px;color:var(--ink-3);font-weight:700}
  .ccard .mini{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:10px}
  .ccard .mini > div{display:flex;flex-direction:column}
  .ccard .mini b{font-size:14px}.ccard .mini span{font-size:10.5px;color:var(--ink-3)}
  .covline{display:flex;align-items:center;gap:8px;margin-top:12px}
  .covline .n{font-weight:800;font-size:15px}
  .covline .n.g{color:var(--green)}.covline .n.a{color:var(--amber)}.covline .n.r{color:var(--red)}
  .covline .prog{flex:1}
  .c-ok{color:var(--green)}.c-bad{color:var(--red)}.c-warn{color:var(--amber)}

  .tablewrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-sm);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
  th{background:var(--paper2);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-2);
    position:sticky;top:0;cursor:pointer;user-select:none}
  th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
  th .ar{color:var(--navy);margin-left:4px}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:#faf7f1}
  td.strong{font-weight:800} td.dim{color:var(--ink-2)}
  .pill{font-weight:800;padding:2px 8px;border-radius:999px;font-size:12px;white-space:nowrap}
  .pill.g{background:var(--green-bg);color:var(--green)}.pill.a{background:var(--amber-bg);color:var(--amber)}.pill.r{background:var(--red-bg);color:var(--red)}
  .pill.shift{background:#e5eefb;color:var(--blue)}.pill.untr{background:var(--amber-bg);color:var(--amber)}
  .pill.death{background:var(--red-bg);color:var(--red)}.pill.refuse{background:#efeaf9;color:var(--purple)}
  .pill.enrol{background:#d7f2ee;color:var(--teal)}

  .ov{position:fixed;inset:0;background:rgba(18,41,77,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
  .modal{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:var(--r-lg);box-shadow:var(--sh-md)}
  .modal .mh{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:2}
  .modal .mh h3{font-size:20px}.modal .mh .e{font-size:11.5px;color:var(--ink-3)}
  .xbtn{border:none;background:var(--paper2);width:32px;height:32px;border-radius:8px;font-size:15px;color:var(--ink-2)}
  .xbtn:hover{background:var(--red-bg);color:var(--red)}
  .mbody{padding:16px 18px}
  .who{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink-2);margin:2px 0 14px}
  .who b{color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
  .chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--ink-2)}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .rostwrap{max-height:44vh;overflow:auto;border:1px solid var(--border);border-radius:var(--r-md)}
  .rostwrap table{min-width:560px}
  .note{background:var(--amber-bg);color:var(--amber);border:1px solid #f0dca6;border-radius:var(--r-md);padding:12px;font-size:12.5px;font-weight:600}
  .loading{color:var(--ink-3);font-size:13px;padding:16px}

  .foot{text-align:center;color:var(--ink-3);font-size:11.5px;margin-top:26px;line-height:1.7}
  .err{background:var(--red-bg);color:var(--red);border:1px solid #f3caca;border-radius:var(--r-md);padding:16px;margin:20px 0}

  @media(max-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}.kpi:nth-child(4){border-right:none}.panels{grid-template-columns:1fr}}
  @media(max-width:560px){
    .kpis{grid-template-columns:repeat(2,1fr)}.kpi{border-right:none}.bigrow{grid-template-columns:1fr}
    .crumbs{flex:1 1 100%;order:-1}.seg{flex:1 1 auto}.seg button{flex:1}.search{flex:1 1 100%;min-width:0}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div><h1 id="title">SIR 2026 | Digitization Gap against MP 2024 Voters</h1>
      <div class="sub" id="subtitle">AC-174 Mahadevapura</div></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <a href="./trend.html" class="date-badge" style="text-decoration:none">📈 Trend dashboard</a>
      <span class="date-badge" id="dateBadge">02 AUG 2026</span>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="controls">
    <button class="back" id="back">&larr; Back</button>
    <nav class="crumbs" id="crumbs"></nav>
    <div class="seg" id="mandalFilter" role="group" aria-label="Mandala filter">
      <button data-f="All" class="on">All</button><button data-f="Urban">Urban</button><button data-f="Rural">Rural</button>
    </div>
    <input class="search" id="search" placeholder="Search ward / booth # / voter name / EPIC" aria-label="Search ward, booth, voter name or EPIC">
  </div>
  <div id="app"></div>
  <div class="foot" id="foot"></div>
</div>

<div class="tip" id="tip"></div>
<script id="ac174-data" type="application/json">null</script>
<script id="booth-rosters" type="application/json">null</script>
<script>
"use strict";
(function(){
  const $=(s,r=document)=>r.querySelector(s);
  const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
  const fmt=n=>(n==null?0:n).toLocaleString('en-IN');
  const pct=(n,d)=>d?(100*n/d):0;
  const p1=n=>(n||0).toFixed(1)+'%';
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const SUM=['totalVoters','mpVoted','sirSubmitted','delTotal','permShifted','untraceable','efRefused','death','enrolledElsewhere'];
  function agg(rows){const t={};SUM.forEach(k=>t[k]=0);for(const r of rows)for(const k of SUM)t[k]+=r[k]||0;
    t.count=rows.length;
    t.coverage=pct(t.sirSubmitted,t.mpVoted); t.digitized=pct(t.sirSubmitted,t.totalVoters);
    t.deletion=pct(t.delTotal,t.totalVoters); t.turnout=pct(t.mpVoted,t.totalVoters);
    t.notSubmitted=t.totalVoters-t.sirSubmitted; t.votedGap=t.mpVoted-t.sirSubmitted; return t;}
  const covBand=c=>c>=100?'g':c>=90?'a':'r';
  const digBand=d=>d>=55?'g':d>=45?'a':'r';

  // Composition of Total Voters = Submitted + 5 deletion categories (sums to total in this data)
  const COMP=[['Submitted','sirSubmitted','var(--green)'],['Permanently Shifted','permShifted','var(--blue)'],
    ['Untraceable/Absent','untraceable','var(--amber)'],['EF Refused','efRefused','var(--purple)'],
    ['Death','death','var(--red)'],['Enrolled Elsewhere','enrolledElsewhere','var(--teal)']];
  function compBar(t){
    const tot=Math.max(1,t.totalVoters);
    return `<div class="comp">`+COMP.map(([nm,k,c])=>`<span title="${esc(nm)}: ${fmt(t[k])} (${p1(pct(t[k],tot))})" style="width:${100*t[k]/tot}%;background:${c}"></span>`).join('')+`</div>`;
  }
  function compLegend(t){const tot=Math.max(1,t.totalVoters);
    return `<div class="legend">`+COMP.map(([nm,k,c])=>`<span><b style="background:${c}"></b>${esc(nm)} — <b style="color:var(--ink)">${fmt(t[k])}</b> (${p1(pct(t[k],tot))})</span>`).join('')+`</div>`;}

  let DATA=null,BOOTHS=[],ROSTERS=null,WARDPREZ={},VOTERIDX=null,pendingRosterQ='';
  const st={level:'assembly',mandal:null,ward:null,booth:null,filter:'All',sortKey:'booth',sortDir:1};
  // history-backed navigation so the browser / phone Back button walks the levels
  function snapshot(){return {level:st.level,mandal:st.mandal,ward:st.ward,booth:st.booth,filter:st.filter,sortKey:st.sortKey,sortDir:st.sortDir};}
  function go(ns){Object.assign(st,ns);history.pushState(snapshot(),'');window.scrollTo(0,0);render();}

  function scopeBooths(){let b=BOOTHS;
    if(st.filter!=='All'&&st.level==='assembly')b=b.filter(x=>x.mandal===st.filter);
    if(st.mandal)b=b.filter(x=>x.mandal===st.mandal);
    if(st.ward)b=b.filter(x=>x.ward===st.ward);return b;}

  function areaChart(labels,sA,sB,colA,colB){
    const W=560,H=210,pl=44,pr=12,pt=14,pb=26,n=labels.length,max=Math.max(1,...sA,...sB);
    const x=i=>n<=1?pl+(W-pl-pr)/2:pl+i*(W-pl-pr)/(n-1), y=v=>H-pb-(v/max)*(H-pt-pb);
    const line=s=>s.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    const area=s=>`M ${x(0)},${H-pb} `+s.map((v,i)=>`L ${x(i)},${y(v)}`).join(' ')+` L ${x(n-1)},${H-pb} Z`;
    let gap=`M `+sB.map((v,i)=>`${x(i)},${y(v)} `).join('L ')+' ';for(let i=n-1;i>=0;i--)gap+=`L ${x(i)},${y(sA[i])} `;gap+='Z';
    const grid=[0,.5,1].map(f=>{const gy=y(max*f);return `<line x1="${pl}" y1="${gy}" x2="${W-pr}" y2="${gy}" stroke="#eee3d0"/><text x="${pl-6}" y="${gy+3}" text-anchor="end" font-size="9" fill="#93a0b5">${fmt(Math.round(max*f))}</text>`;}).join('');
    const dots=(s,c)=>s.map((v,i)=>`<circle class="dot" cx="${x(i)}" cy="${y(v)}" r="3.4" fill="${c}" data-i="${i}"/>`).join('');
    const xl=n<=14?labels.map((l,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="#93a0b5">${esc(String(l).slice(0,7))}</text>`).join(''):'';
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">${grid}
      <path d="${gap}" fill="${colB}" opacity=".16"/><path d="${area(sB)}" fill="${colB}" opacity=".10"/><polyline points="${line(sB)}" fill="none" stroke="${colB}" stroke-width="2"/>
      <path d="${area(sA)}" fill="${colA}" opacity=".16"/><polyline points="${line(sA)}" fill="none" stroke="${colA}" stroke-width="2.4"/>${dots(sB,colB)}${dots(sA,colA)}${xl}</svg>`;
  }

  function children(){const b=scopeBooths();
    if(st.level==='assembly'){const ms=st.filter==='All'?DATA.meta.mandals:[st.filter];
      return ms.map(m=>({key:m,name:m+' Mandala',type:'mandala',rows:b.filter(x=>x.mandal===m)})).filter(c=>c.rows.length);}
    if(st.level==='mandala'){const wm=new Map();for(const x of b){if(!wm.has(x.ward))wm.set(x.ward,[]);wm.get(x.ward).push(x);}
      return [...wm.entries()].sort((a,z)=>a[0].localeCompare(z[0])).map(([w,rows])=>({key:w,name:w,type:'ward',rows}));}
    return [];}

  const BAR_SERIES=[['totalVoters','Total Voters','var(--ink-3)'],['mpVoted','MP Voted 2024','var(--navy)'],
    ['sirSubmitted','SIR Submitted','var(--green)'],['delTotal','SIR Delete','var(--red)']];
  function groupedBar(items){
    const n=items.length, S=BAR_SERIES.length;
    const barW=9, inGap=2, groupPad=16, pl=52, pr=12, pt=12, pb=54, H=270;
    const groupW=S*barW+(S-1)*inGap;
    const W=Math.max(560, pl+pr+n*(groupW+groupPad));
    const plotH=H-pt-pb;
    let max=1; for(const it of items) for(const[k] of BAR_SERIES) max=Math.max(max,it.a[k]||0);
    const nice=Math.pow(10,Math.floor(Math.log10(max))); const top=Math.ceil(max/nice)*nice;
    const y=v=>H-pb-(v/top)*plotH;
    const grid=[0,.25,.5,.75,1].map(f=>{const gy=y(top*f);return `<line x1="${pl}" y1="${gy}" x2="${W-pr}" y2="${gy}" stroke="#eee3d0"/><text x="${pl-6}" y="${gy+3}" text-anchor="end" font-size="9" fill="#93a0b5">${fmt(Math.round(top*f))}</text>`;}).join('');
    const groups=items.map((it,gi)=>{
      const gx=pl+groupPad/2+gi*(groupW+groupPad);
      const bars=BAR_SERIES.map(([k,label,c],si)=>{const v=it.a[k]||0,bx=gx+si*(barW+inGap),by=y(v),bh=H-pb-by;
        return `<rect x="${bx}" y="${by}" width="${barW}" height="${Math.max(0,bh)}" fill="${c}" rx="1.5"><title>${esc(it.name)} — ${esc(label)}: ${fmt(v)}</title></rect>`;}).join('');
      const lbl=esc(String(it.name).length>9?String(it.name).slice(0,8)+'…':it.name);
      return `${bars}<text x="${gx+groupW/2}" y="${H-pb+14}" text-anchor="end" font-size="9" fill="#54607a" transform="rotate(-35 ${gx+groupW/2} ${H-pb+14})">${lbl}</text>`;
    }).join('');
    const legend=`<div class="legend" style="margin-top:8px">`+BAR_SERIES.map(([k,l,c])=>`<span><b style="background:${c}"></b>${l}</span>`).join('')+`</div>`;
    return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%;min-width:${Math.min(W,720)}px;height:auto;display:block">${grid}${groups}</svg></div>${legend}`;
  }

  const COLS=[['booth','Booth',0],['blo','BLO',0],['totalVoters','Total Voters',1],
    ['mpVoted','MP Voted',1],['sirSubmitted','SIR Submitted',1],['delTotal','SIR Delete',1],

  function rowVals(x){const a=agg([x]);return {booth:x.booth,blo:x.blo||'—',

  function boothTable(b){

  const REASON_PILL={'Death':'death','Permanently Shifted':'shift','Untraceable/Absent':'untr','EF Refused':'refuse','Enrolled Elsewhere':'enrol'};
  async function loadRoster(n){

  async function hydrateBooth(x){

    if(note){
      note.innerHTML = data.total===x.delTotal
        ? `${data.total} names · ASDD list dated ${esc(data.asddDate||DATA.meta.asddDate)} · filter by reason or search name / EPIC`

  function renderRoster(host,rows){
    const cats=['All'];const counts={All:rows.length};
    for(const r of rows){if(!(r.reason in counts)){counts[r.reason]=0;cats.push(r.reason);}counts[r.reason]++;}
    let cur='All',q=pendingRosterQ||'';pendingRosterQ='';
    host.innerHTML=`<div class="chips" id="chips">${cats.map(c=>`<button class="chip ${c==='All'?'on':''}" data-c="${esc(c)}">${esc(c)} (${counts[c]})</button>`).join('')}</div>
      <input class="search" id="rq" placeholder="Search name or EPIC…" style="width:100%;margin-bottom:8px" aria-label="Search deletion list">
      <div class="rostwrap"><table><thead><tr><th title="ECI roll serial number">Sl. No</th><th>Name</th><th>EPIC</th><th>Relative</th><th class="r">Age</th><th>Reason</th></tr></thead><tbody id="rbody"></tbody></table></div>
      <div class="scope-meta" id="rcount" style="margin-top:8px"></div>`;
    const body=host.querySelector('#rbody'),rcount=host.querySelector('#rcount');

        <td class="dim">${esc(r.relative)}</td><td class="r">${r.age==null?'—':r.age}</td>
        <td><span class="pill ${REASON_PILL[r.reason]||''}">${esc(r.reason)}</span></td></tr>`).join('')
        ||`<tr><td colspan="6" class="dim" style="text-align:center;padding:20px">No matching voters.</td></tr>`;
      rcount.textContent=`${f.length} of ${rows.length} shown`+(f.length>2000?' (first 2000)':'');

  function renderCrumbs(){const c=$('#crumbs');const parts=[['Assembly',{level:'assembly',mandal:null,ward:null,booth:null}]];

  async function ensureVoterIdx(){
    if(VOTERIDX)return VOTERIDX;
    try{const r=await fetch('./data/voter_index.json',{cache:'no-store'});if(r.ok){VOTERIDX=await r.json();return VOTERIDX;}}catch(e){}
    if(ROSTERS){const a=[];for(const bk in ROSTERS){const bn=+bk;for(const d of ROSTERS[bk].deletions)a.push([d.epic,d.name,bn,d.serial]);}VOTERIDX=a;return a;}
    return null;
  }
  let searchSeq=0;
  async function doSearch(raw){
    const q=raw.trim();
    if(!q){if(st.level!=='booth')render();return;}     // empty -> restore current view
    // pure booth number -> jump straight to that booth page
    if(/^\d+$/.test(q)){const x=BOOTHS.find(b=>b.booth===+q);if(x){go({level:'booth',mandal:x.mandal,ward:x.ward,booth:x.booth});return;}}
    const seq=++searchSeq, ql=q.toLowerCase();
    const booths=[],wards=[],wset=new Set();
    for(const b of BOOTHS){if(b.ward.toLowerCase().includes(ql)&&!wset.has(b.ward)){wset.add(b.ward);wards.push(b);if(wards.length>=8)break;}}
    let voters=[];
    if(ql.length>=2){const idx=await ensureVoterIdx();if(seq!==searchSeq)return;
      if(idx){for(const v of idx){if(v[0].toLowerCase().includes(ql)||(v[1]||'').toLowerCase().includes(ql)){voters.push(v);if(voters.length>=60)break;}}}}
    if(seq!==searchSeq)return;
    renderSearchResults(q,{booths,wards,voters});
  }
  function renderSearchResults(q,r){
    const wh=r.wards.map(w=>`<button class="sr" data-t="ward" data-ward="${esc(w.ward)}" data-mandal="${esc(w.mandal)}"><span><b>${esc(w.ward)}</b> ward</span><span class="dim">${esc(w.mandal)} mandala</span></button>`).join('');
    const bh=r.booths.map(x=>`<button class="sr" data-t="booth" data-booth="${x.booth}"><span><b>Booth #${x.booth}</b></span><span class="dim">${esc(x.ward)} · ${esc(x.mandal)}</span></button>`).join('');
    const vh=r.voters.map(v=>`<button class="sr" data-t="voter" data-booth="${v[2]}" data-epic="${esc(v[0])}"><span><b>${esc(v[1])}</b> <span class="dim">${esc(v[0])}</span></span><span class="dim">Booth #${v[2]}${v[3]!=null?' · Sl.No '+v[3]:''}</span></button>`).join('');
    const none=!r.wards.length&&!r.booths.length&&!r.voters.length;
    $('#app').innerHTML=`<h2 class="scope">Search: &ldquo;${esc(q)}&rdquo;</h2>
      <div class="scope-meta">${r.wards.length} wards · ${r.booths.length} booths · ${r.voters.length} deleted voters matched${r.voters.length>=60?' (first 60 — refine to narrow)':''}</div>
      ${r.booths.length?`<div class="sect"><h3>Booths</h3></div><div class="srlist">${bh}</div>`:''}
      ${r.wards.length?`<div class="sect"><h3>Wards</h3></div><div class="srlist">${wh}</div>`:''}
      ${r.voters.length?`<div class="sect"><h3>Deleted / to-be-deleted voters</h3></div><div class="srlist">${vh}</div>`:''}
      ${none?`<div class="note">No ward, booth, or deleted voter matches &ldquo;${esc(q)}&rdquo;. Only deleted / to-be-deleted voters are name-searchable.</div>`:''}`;
    document.querySelectorAll('.sr').forEach(b=>b.addEventListener('click',()=>{
      const t=b.dataset.t;
      if(t==='ward')go({level:'ward',mandal:b.dataset.mandal,ward:b.dataset.ward,booth:null});
      else{const x=BOOTHS.find(z=>z.booth===+b.dataset.booth);if(!x)return;
        if(t==='voter')pendingRosterQ=b.dataset.epic;
        go({level:'booth',mandal:x.mandal,ward:x.ward,booth:x.booth});}
    }));
    updateFoot();
  }

  async function loadData(){
    try{const r=await fetch('./data/ac174.json',{cache:'no-store'});if(r.ok)return await r.json();}catch(e){}
    const inline=$('#ac174-data').textContent.trim();if(inline&&inline!=='null')return JSON.parse(inline);
    throw new Error('No data: expected ./data/ac174.json or embedded data.');}

  loadData().then(d=>{
    DATA=d;BOOTHS=d.booths;WARDPREZ=d.meta.wardPresident||{};
    const rb=$('#booth-rosters').textContent.trim();if(rb&&rb!=='null'){try{ROSTERS=JSON.parse(rb);}catch(e){}}
    $('#title').textContent=d.meta.title;$('#subtitle').textContent=d.meta.subtitle;$('#dateBadge').textContent=d.meta.dateBadge;document.title=d.meta.subtitle;
    $('#back').addEventListener('click',()=>history.back());
    $('#mandalFilter').addEventListener('click',e=>{const f=e.target.dataset.f;if(f){st.filter=f;render();}});
    let tmr;$('#search').addEventListener('input',e=>{clearTimeout(tmr);const v=e.target.value;tmr=setTimeout(()=>doSearch(v),300);});
    window.addEventListener('popstate',e=>{const s=e.state||{level:'assembly',mandal:null,ward:null,booth:null};Object.assign(st,s);window.scrollTo(0,0);render();});
    render();
    history.replaceState(snapshot(),'');   // seed the first history entry (assembly view)
  }).catch(err=>{$('#app').innerHTML=`<div class="err"><b>Could not load data.</b><br>${esc(err.message)}</div>`;});
})();
</script>
</body>
</html>
