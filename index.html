<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AC-174 Mahadevapura — SIR 2026 vs MP 2024 Voters</title>
<style>
  :root{
    --paper:#f4efe6; --paper2:#ece4d6;
    --navy:#12294d; --navy-2:#1c3a66; --navy-ink:#e8eefb;
    --card:#ffffff; --border:#e3dccd; --border-2:#d8cfbc;
    --ink:#1b2436; --ink-2:#54607a; --ink-3:#93a0b5;
    --green:#158a4a; --green-bg:#dff3e6;
    --amber:#c67c05; --amber-bg:#fbedcf;
    --red:#cf2b2b; --red-bg:#fbe0e0;
    --blue:#2563a8; --purple:#7c5cbf; --teal:#0d9488;
    --unmap:#6d3bd4; --unmap-bg:#ece3fb;
    --r-sm:8px; --r-md:12px; --r-lg:16px;
    --sh-sm:0 1px 2px rgba(18,41,77,.06);

    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  body{padding-bottom:40px}
  button{font-family:inherit;cursor:pointer}
  .wrap{max-width:1220px;margin:0 auto;padding:clamp(14px,3vw,26px)}

  header.top{background:linear-gradient(120deg,var(--navy),var(--navy-2));color:#fff}
  .top-inner{max-width:1220px;margin:0 auto;padding:clamp(16px,3vw,26px) clamp(14px,3vw,26px);
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .top h1{font-size:clamp(18px,3vw,25px);font-weight:800;letter-spacing:-.01em;line-height:1.15}
  .top .sub{color:#b9c8e6;font-size:clamp(12px,2vw,14px);margin-top:4px}
  .date-badge{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
    color:#fff;font-weight:700;font-size:12px;padding:8px 12px;border-radius:999px;white-space:nowrap}

  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 8px}
  .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;flex:1;min-width:180px}

  .crumbs span{color:var(--ink-3)}
  .back{background:#fff;border:1px solid var(--border);color:var(--navy);font-weight:700;
    padding:8px 14px;border-radius:var(--r-sm);font-size:13px;box-shadow:var(--sh-sm)}
  .back:hover{background:var(--paper2)} .back[disabled]{opacity:.4;cursor:not-allowed}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--border);border-radius:var(--r-sm);padding:3px;box-shadow:var(--sh-sm)}
  .seg button{border:none;background:none;padding:7px 12px;border-radius:6px;font-size:13px;color:var(--ink-2);font-weight:600}
  .seg button.on{background:var(--navy);color:#fff}
  .search{border:1px solid var(--border);background:#fff;border-radius:var(--r-sm);padding:9px 12px;

  .kpis{background:linear-gradient(120deg,var(--navy),var(--navy-2));border-radius:var(--r-lg);

  .kpi .v.g{color:#5ce68f}.kpi .v.a{color:#ffcd6b}.kpi .v.r{color:#ff8f8f}

  .big .num{font-size:clamp(34px,7vw,52px);font-weight:800;line-height:1;margin:6px 0 4px}
  .big .num.g{color:var(--green)}.big .num.a{color:var(--amber)}.big .num.r{color:var(--red)}.big .num.u{color:var(--unmap)}
  .big .den{font-size:12.5px;color:var(--ink-3);margin-bottom:12px}
  .prog{height:10px;background:var(--paper2);border-radius:999px;overflow:hidden}
  .prog > i{display:block;height:100%;border-radius:999px}
  .prog > i.g{background:var(--green)}.prog > i.a{background:var(--amber)}.prog > i.r{background:var(--red)}.prog > i.u{background:var(--unmap)}

  .panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-sm)}

  /* clean aligned composition legend (no overlap, wraps on phone) */
  .complegend{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px 16px;margin-top:12px}
  .cli{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);min-width:0}
  .cli .cl-nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cli .cl-n{color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
  .cli .cl-p{color:var(--ink-3);font-weight:700;min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
  /* dual labelled %-bars (coverage + SIR submitted) */
  .pctbars{display:flex;flex-direction:column;gap:9px;margin-top:12px}
  .pb-l{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--ink-2);font-weight:700;margin-bottom:3px}
  .pb-l .pb-v{font-size:14px;font-weight:800}
  .pb-v.g{color:var(--green)}.pb-v.a{color:var(--amber)}.pb-v.r{color:var(--red)}.pb-v.u{color:var(--unmap)}
  /* colourful animated "tap to open" call-to-action */
  .tapcta{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:14px;
    background:linear-gradient(120deg,var(--blue),#3b82d6);color:#fff;font-weight:800;font-size:12.5px;
    letter-spacing:.3px;padding:10px 12px;border-radius:10px;box-shadow:0 3px 10px rgba(37,99,168,.32);
    animation:ctaglow 1.9s var(--ease) infinite}
  .tapcta .arw{font-size:16px;display:inline-block;animation:nudge 1.2s var(--ease) infinite}
  .ccard:hover .tapcta{background:linear-gradient(120deg,var(--navy),var(--navy-2));box-shadow:0 5px 16px rgba(18,41,77,.34)}
  .ccard:hover .tapcta .arw{animation:none;transform:translateX(5px)}
  @keyframes ctaglow{0%,100%{box-shadow:0 3px 10px rgba(37,99,168,.28)}50%{box-shadow:0 4px 18px rgba(37,99,168,.55)}}
  .callout{display:inline-flex;align-items:center;gap:8px;background:var(--red-bg);color:var(--red);
    border:1px solid #f3caca;border-radius:var(--r-sm);padding:8px 12px;font-size:12.5px;font-weight:700;margin-top:12px}

  svg.chart{width:100%;height:auto;display:block;overflow:visible}
  .grpclick{cursor:pointer} .grpclick:hover{fill:rgba(37,99,168,.07)}
  th.sorth{cursor:pointer}
  /* ward PDF report (native print-to-PDF; hidden on screen) */
  #printarea{display:none}
  #printarea .prpt{font-family:var(--font);color:#000}
  #printarea h1{font-size:17px;margin:0 0 2px}
  #printarea .prsub{font-size:11px;color:#333;margin-bottom:10px}
  #printarea table.prt{width:100%;border-collapse:collapse;font-size:10px}
  #printarea .prt th,#printarea .prt td{border:1px solid #999;padding:4px 6px;text-align:left}
  #printarea .prt th{background:#eaeaea}
  #printarea .prt td.n,#printarea .prt th.n{text-align:right;font-variant-numeric:tabular-nums}
  #printarea .prt tr.tot td{font-weight:800;background:#f1f1f1}
  #printarea .prfoot{font-size:8.5px;color:#555;margin-top:10px}
  @media print{
    body.printmode > *{visibility:hidden}
    body.printmode #printarea{display:block;visibility:visible;position:absolute;inset:0;width:100%}
    body.printmode #printarea *{visibility:visible}
    @page{margin:12mm}
  }
  .pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:12px}
  .pgb{border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:700;color:var(--navy);box-shadow:var(--sh-sm)}
  .pgb:hover:not([disabled]){background:var(--paper2)} .pgb[disabled]{opacity:.4;cursor:not-allowed}
  .pgi{font-size:12.5px;color:var(--ink-2);font-weight:700;padding:0 6px}
  .dot{cursor:pointer}
  .tip{position:fixed;pointer-events:none;background:var(--navy);color:#fff;font-size:12px;
    padding:7px 10px;border-radius:8px;box-shadow:var(--sh-md);opacity:0;transition:opacity .1s;z-index:60;white-space:nowrap}

  /* composition stacked bar */
  .comp{display:flex;height:22px;border-radius:7px;overflow:hidden;border:1px solid var(--border);margin:4px 0}
  .comp > span{display:block;min-width:0}
  .delgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px}
  .delcell{border:1px solid var(--border);border-radius:var(--r-sm);padding:10px}
  .delcell .dv{font-size:17px;font-weight:800}.delcell .dl{font-size:11px;color:var(--ink-2);margin-top:2px}
  .delcell .dp{font-size:11px;color:var(--ink-3);font-weight:700}
  .boothid{background:var(--unmap-bg);border:1px solid #d6c8f2;border-radius:var(--r-md);padding:10px 13px;margin:10px 0 8px}
  .bid-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13.5px;color:var(--ink)}
  .bid-tag{background:var(--unmap);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .bid-school{font-size:12px;color:var(--ink-2);margin-top:5px}

  .sect{display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px;flex-wrap:wrap;gap:8px}
  .sect h3{font-size:15px;font-weight:800}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .ccard{text-align:left;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);
    box-shadow:var(--sh-sm);overflow:hidden;transition:transform .12s var(--ease),box-shadow .12s var(--ease),border-color .12s;width:100%}
  .ccard:hover{transform:translateY(-3px);box-shadow:var(--sh-md);border-color:var(--navy-2)}
  .ccard:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .ccard .ch{background:linear-gradient(120deg,var(--navy),var(--navy-2));color:#fff;
    padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .ccard .ch .nm{font-weight:800;font-size:15px}
  .ccard .ch .mb{font-size:11px;color:#b9c8e6;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .ccard .ch .chev{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;
    background:rgba(255,255,255,.16);color:#fff;font-size:14px;font-weight:800;line-height:1;transition:transform .15s var(--ease),background .15s}
  .ccard:hover .ch .chev,.ccard:focus-visible .ch .chev{transform:translateX(3px);background:rgba(255,255,255,.32)}
  /* explicit "tap to open" call-to-action with a nudging arrow */
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
  @keyframes cardin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .ccard{animation:cardin .34s var(--ease) both}
  .taphint{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--blue);
    background:#e8f0fb;border:1px solid #cfe0f5;border-radius:999px;padding:4px 11px;margin-left:8px}
  .taphint .fingr{animation:tapbob 1.4s var(--ease) infinite}
  @keyframes tapbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .ccard .cb{padding:14px}
  .hl2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .hl{border-radius:10px;padding:9px 11px}
  .hl.tot{background:#e9eff7;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .hl.tot .t{margin:0}
  .hl.tot .n{color:var(--navy);font-size:21px}
  .hl.sub{background:var(--green-bg)} .hl.del{background:var(--red-bg)}
  .hl .n{font-size:22px;font-weight:800;line-height:1}
  .hl.sub .n{color:var(--green)} .hl.del .n{color:var(--red)}
  .hl .t{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-2);margin-top:3px}
  .hl .p{font-size:11px;color:var(--ink-3);font-weight:700}
  .ccard .mini{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:10px}
  .ccard .mini > div{display:flex;flex-direction:column}
  .ccard .mini b{font-size:14px}.ccard .mini span{font-size:10.5px;color:var(--ink-3)}
  .covline{display:flex;align-items:center;gap:8px;margin-top:12px}
  .covline .n{font-weight:800;font-size:15px}
  .covline .n.g{color:var(--green)}.covline .n.a{color:var(--amber)}.covline .n.r{color:var(--red)}
  .covline .prog{flex:1}
  .c-ok{color:var(--green)}.c-bad{color:var(--red)}.c-warn{color:var(--amber)}

  .tablewrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-sm);overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
  th{background:var(--paper2);font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-2);
    position:sticky;top:0;cursor:pointer;user-select:none}
  th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
  th .ar{color:var(--navy);margin-left:4px}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:#faf7f1}
  td.strong{font-weight:800} td.dim{color:var(--ink-2)}
  .pill{font-weight:800;padding:2px 8px;border-radius:999px;font-size:12px;white-space:nowrap}
  .pill.g{background:var(--green-bg);color:var(--green)}.pill.a{background:var(--amber-bg);color:var(--amber)}.pill.r{background:var(--red-bg);color:var(--red)}
  .pill.shift{background:#e5eefb;color:var(--blue)}.pill.untr{background:var(--amber-bg);color:var(--amber)}
  .pill.death{background:var(--red-bg);color:var(--red)}.pill.refuse{background:#efeaf9;color:var(--purple)}
  .pill.enrol{background:#d7f2ee;color:var(--teal)}
  .pill.u{background:var(--unmap-bg);color:var(--unmap)}

  .ov{position:fixed;inset:0;background:rgba(18,41,77,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
  .modal{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:var(--r-lg);box-shadow:var(--sh-md)}
  .modal .mh{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:2}
  .modal .mh h3{font-size:20px}.modal .mh .e{font-size:11.5px;color:var(--ink-3)}
  .xbtn{border:none;background:var(--paper2);width:32px;height:32px;border-radius:8px;font-size:15px;color:var(--ink-2)}
  .xbtn:hover{background:var(--red-bg);color:var(--red)}
  .mbody{padding:16px 18px}
  .who{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink-2);margin:2px 0 14px}
  .who b{color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
  .chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--ink-2)}
  .chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .rostwrap{max-height:44vh;overflow:auto;border:1px solid var(--border);border-radius:var(--r-md)}
  .rostwrap table{min-width:560px}
  .note{background:var(--amber-bg);color:var(--amber);border:1px solid #f0dca6;border-radius:var(--r-md);padding:12px;font-size:12.5px;font-weight:600}
  .loading{color:var(--ink-3);font-size:13px;padding:16px}

  .foot{text-align:center;color:var(--ink-3);font-size:11.5px;margin-top:26px;line-height:1.7}
  .err{background:var(--red-bg);color:var(--red);border:1px solid #f3caca;border-radius:var(--r-md);padding:16px;margin:20px 0}

  @media(max-width:900px){.kpis{grid-template-columns:repeat(4,1fr)}.kpi:nth-child(4){border-right:none}.panels{grid-template-columns:1fr}}
  @media(max-width:560px){
    .kpis{grid-template-columns:repeat(2,1fr)}.kpi{border-right:none}.bigrow{grid-template-columns:1fr}
    .crumbs{flex:1 1 100%;order:-1}.seg{flex:1 1 auto}.seg button{flex:1}.search{flex:1 1 100%;min-width:0}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div><h1 id="title">SIR 2026 | Digitization Gap against MP 2024 Voters</h1>
      <div class="sub" id="subtitle">AC-174 Mahadevapura</div></div>

  </div>

    <input class="search" id="search" placeholder="Search name / relative / EPIC / ward / booth #" aria-label="Search voter name, relative, EPIC, ward or booth">

</div>

<script>
"use strict";
(function(){
  const $=(s,r=document)=>r.querySelector(s);
  const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
  const fmt=n=>(n==null?0:n).toLocaleString('en-IN');

  const COLS=[['booth','Booth',0],['booth2025','2025 #',0],['blo','BLO',0],['totalVoters','Total Voters',1],

  function downloadWardPDF(){

    const oldTitle=document.title; document.title=`AC174_${st.ward}_booths`.replace(/\s+/g,'_');

  // paginated "all booths in scope" list (below the cards at assembly/mandala level)
  let _blBooths=[], _blPage=0, _blKey='coverage', _blDir=1; const BL_SIZE=20;
  function boothListSection(title){
    _blPage=0; _blKey='coverage'; _blDir=1;   // default: sort by MP % then SIR Sub %
    return `<div class="panel" style="margin-bottom:16px"><div class="sect" style="margin:0 0 6px"><h3>${esc(title)}</h3></div>

      <div id="bl"></div></div>`;
  }
  function blInit(){
    const host=$('#bl'); if(!host)return;
    if(BOOTHS.length){blDraw();return;}
    host.innerHTML=`<div class="loading" style="cursor:pointer">Tap or scroll here to load the full booth list…</div>`;
    const load=()=>ensureBooths(()=>{const h=$('#bl');if(h)blDraw();});
    if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){io.disconnect();load();}});io.observe(host);}
    host.addEventListener('click',load,{once:true});
  }
  function blDraw(){
    const host=$('#bl'); if(!host)return;
    _blBooths=scopeBooths();
    const rows=_blBooths.map(x=>({ward:x.ward,booth:x.booth,mandal:x.mandal,
      coverage:pct(x.sirSubmitted,x.mpVoted), digitized:pct(x.sirSubmitted,x.totalVoters)}));
    rows.sort((a,b)=>{const p=(a[_blKey]-b[_blKey])*_blDir; return p || (a.coverage-b.coverage) || (a.digitized-b.digitized);});
    const pages=Math.max(1,Math.ceil(rows.length/BL_SIZE));
    _blPage=Math.min(Math.max(0,_blPage),pages-1);
    const slice=rows.slice(_blPage*BL_SIZE, _blPage*BL_SIZE+BL_SIZE);
    const arw=k=>_blKey===k?`<span class="ar">${_blDir>0?'▲':'▼'}</span>`:'';
    host.innerHTML=`<div class="tablewrap"><table><thead><tr>
        <th>Ward</th><th>Booth</th>
        <th class="r sorth" data-k="coverage">MP %${arw('coverage')}</th>

      <tbody>${slice.map(r=>`<tr data-booth="${r.booth}"><td class="dim">${esc(r.ward)}</td><td class="strong">#${r.booth}</td>
        <td class="r"><span class="pill ${covBand(r.coverage)}">${p1(r.coverage)}</span></td>
        <td class="r"><span class="pill ${digBand(r.digitized)}">${p1(r.digitized)}</span></td></tr>`).join('')}</tbody></table></div>

        <button class="pgb" data-p="next" ${_blPage>=pages-1?'disabled':''}>Next ›</button>
        <button class="pgb" data-p="last" ${_blPage>=pages-1?'disabled':''}>Last »</button></div>`;
    host.querySelectorAll('.sorth').forEach(h=>h.addEventListener('click',()=>{const k=h.dataset.k;if(_blKey===k)_blDir*=-1;else{_blKey=k;_blDir=1;}_blPage=0;blDraw();}));
    host.querySelectorAll('.pgb').forEach(btn=>btn.addEventListener('click',()=>{const p=btn.dataset.p;
      if(p==='first')_blPage=0;else if(p==='prev')_blPage--;else if(p==='next')_blPage++;else _blPage=pages-1;blDraw();window.scrollTo({top:host.getBoundingClientRect().top+window.scrollY-80,behavior:'instant'});}));

  const REASON_PILL={'Death':'death','Permanently Shifted':'shift','Untraceable/Absent':'untr','EF Refused':'refuse','Enrolled at another place':'enrol','Marked for Deletion':'shift'};
  async function loadRoster(n){
    try{const r=await fetch(`${DATA_BASE}data/booth/${n}.json`,{cache:'no-store'});if(r.ok)return await r.json();}catch(e){}
    if(hasEmbedded()){                                   // offline: derive booth roster from embedded dataset
      const all=await ensureAllRows();
      const rows=all.filter(r=>r.booth===n).map(r=>[r.serial,r.epic,r.name,r.sex,r.age,r.relative,r.reason]);
      if(rows.length){const cats={};rows.forEach(x=>cats[x[6]]=(cats[x[6]]||0)+1);
        return {booth:n,total:rows.length,cats,rows,asOf:DATA.meta.rosterDate};}
    }
    return null;
  }

    $('#boothBack').addEventListener('click',()=>history.back());
    updateFoot();
    hydrateBooth(x);
    hydrateNomap(x);
  }
  async function hydrateBooth(x){
    const data=await loadRoster(x.booth);
    if(st.level!=='booth'||st.booth!==x.booth)return;      // user navigated away while loading
    const host=$('#rosterHost');if(!host)return;
    if(!data||!data.rows){host.innerHTML=`<div class="note">No individual deletion records found for this booth. Current 'to delete' tally: <b>${fmt(x.delTotal)}</b>.</div>`;return;}
    const note=$('#rosterNote');
    if(note){
      note.innerHTML = data.total===x.delTotal
        ? `${fmt(data.total)} deleted / to-be-deleted voters · list dated ${esc(data.asOf||DATA.meta.rosterDate)} · filter by reason or search name / relative / EPIC`
        : `Showing <b>${fmt(data.total)}</b> named records from the deletion list dated <b>${esc(data.asOf||DATA.meta.rosterDate)}</b>. The booth's aggregate <b>to-delete</b> tally (as on ${esc(DATA.meta.aggAsOf||'2026-08-13')}) is <b>${fmt(x.delTotal)}</b>${x.delTotal>data.total?` — ${fmt(x.delTotal-data.total)} more from the later aggregate`:''}. Filter by reason or search name / relative / EPIC.`;
      if(data.total!==x.delTotal){note.style.color='var(--amber)';note.style.fontWeight='600';}
    }
    renderRoster(host,data.rows);
  }
  // rows are arrays: [serial, epic, name, sex, age, relative, reason]
  function renderRoster(host,rows){
    const cats=['All'];const counts={All:rows.length};
    for(const r of rows){const rn=r[6];if(!(rn in counts)){counts[rn]=0;cats.push(rn);}counts[rn]++;}
    let cur='All',q=pendingRosterQ||'';pendingRosterQ='';
    host.innerHTML=`<div class="chips" id="chips">${cats.map(c=>`<button class="chip ${c==='All'?'on':''}" data-c="${esc(c)}">${esc(c)} (${fmt(counts[c])})</button>`).join('')}</div>
      <input class="search" id="rq" placeholder="Search name / relative / EPIC…" style="width:100%;margin-bottom:8px" aria-label="Search deletion list">
      <div class="rostwrap"><table><thead><tr><th title="ECI roll serial number">Sl. No</th><th>Name</th><th>EPIC</th><th>Relative</th><th class="r">Age</th><th>Sex</th><th>Reason</th></tr></thead><tbody id="rbody"></tbody></table></div>
      <div class="scope-meta" id="rcount" style="margin-top:8px"></div>`;
    const body=host.querySelector('#rbody'),rcount=host.querySelector('#rcount');
    const draw=()=>{
      const qq=q.trim().toLowerCase();
      const f=rows.filter(r=>(cur==='All'||r[6]===cur)&&(!qq||(r[2]||'').toLowerCase().includes(qq)||(r[5]||'').toLowerCase().includes(qq)||(r[1]||'').toLowerCase().includes(qq)));
      body.innerHTML=f.slice(0,2000).map(r=>`<tr><td class="dim">${esc(r[0])}</td><td class="strong">${esc(r[2])}</td><td class="dim">${esc(r[1])}</td>
        <td class="dim">${esc(r[5])}</td><td class="r">${r[4]||'—'}</td><td class="dim">${esc(r[3]||'—')}</td>
        <td><span class="pill ${REASON_PILL[r[6]]||''}">${esc(r[6])}</span></td></tr>`).join('')
        ||`<tr><td colspan="7" class="dim" style="text-align:center;padding:20px">No matching voters.</td></tr>`;
      rcount.textContent=`${fmt(f.length)} of ${fmt(rows.length)} shown`+(f.length>2000?' (first 2000 — refine to narrow)':'');
    };
    host.querySelector('#chips').addEventListener('click',e=>{const c=e.target.dataset.c;if(!c)return;
      cur=c;[...host.querySelectorAll('.chip')].forEach(ch=>ch.classList.toggle('on',ch.dataset.c===c));draw();});
    const rq=host.querySelector('#rq');if(q)rq.value=q;
    let tmr;rq.addEventListener('input',e=>{clearTimeout(tmr);const v=e.target.value;tmr=setTimeout(()=>{q=v;draw();},200);});
    draw();
  }
  async function hydrateNomap(x){
    const data=await loadNomap(x.booth);
    if(st.level!=='booth'||st.booth!==x.booth)return;      // navigated away while loading
    const host=$('#nomapHost');if(!host)return;
    if(!data||!data.rows||!data.rows.length){
      host.innerHTML=`<div class="note">No no-mapping voters recorded for this booth in the 2026 SIR draft.</div>`;return;}
    const note=$('#nomapNote');
    if(note)note.innerHTML=`<b>${fmt(data.total)}</b> no-mapping voters · <b>${fmt(data.withMobile)}</b> reachable by phone (outreach pool) · draft dated <b>${esc(data.asOf||DATA.meta.noMappingDate)}</b> · filter or search name / relative / EPIC`;
    renderNomap(host,data.rows);
  }
  // rows are arrays: [serial, epic, name, sex, age, relative, in2025(Y/N), beforeBooth, mob(0/1)]
  function renderNomap(host,rows){
    const catOf=r=>r[6]==='Y'?'In 2025 roll':'New (not in 2025)';
    const cats=['All'];const counts={All:rows.length};
    for(const r of rows){const c=catOf(r);if(!(c in counts)){counts[c]=0;cats.push(c);}counts[c]++;}
    let cur='All',q='';
    host.innerHTML=`<div class="chips" id="nmchips">${cats.map(c=>`<button class="chip ${c==='All'?'on':''}" data-c="${esc(c)}">${esc(c)} (${fmt(counts[c])})</button>`).join('')}</div>
      <input class="search" id="nmq" placeholder="Search name / relative / EPIC…" style="width:100%;margin-bottom:8px" aria-label="Search no-mapping list">
      <div class="rostwrap"><table><thead><tr><th title="serial in the 2026 draft">Sl. No</th><th>Name</th><th>EPIC</th><th>Relative</th><th class="r">Age</th><th>Sex</th><th title="was this voter in the 2025 roll?">In 2025 Roll</th><th title="booth number in the 2025 roll">2025 Booth</th><th title="reachable by phone (number kept private)">📱</th></tr></thead><tbody id="nmbody"></tbody></table></div>
      <div class="scope-meta" id="nmcount" style="margin-top:8px"></div>`;
    const body=host.querySelector('#nmbody'),ncount=host.querySelector('#nmcount');
    const draw=()=>{
      const qq=q.trim().toLowerCase();
      const f=rows.filter(r=>(cur==='All'||catOf(r)===cur)&&(!qq||(r[2]||'').toLowerCase().includes(qq)||(r[5]||'').toLowerCase().includes(qq)||(r[1]||'').toLowerCase().includes(qq)));
      body.innerHTML=f.slice(0,2000).map(r=>`<tr><td class="dim">${esc(r[0])}</td><td class="strong">${esc(r[2])}</td><td class="dim">${esc(r[1])}</td>
        <td class="dim">${esc(r[5])}</td><td class="r">${r[4]||'—'}</td><td class="dim">${esc(r[3]||'—')}</td>
        <td>${r[6]==='Y'?'<span class="pill enrol">Yes</span>':'<span class="pill untr">New</span>'}</td>
        <td class="dim">${r[7]?'#'+esc(r[7]):'—'}</td><td>${r[8]?'📱':''}</td></tr>`).join('')
        ||`<tr><td colspan="9" class="dim" style="text-align:center;padding:20px">No matching voters.</td></tr>`;
      ncount.textContent=`${fmt(f.length)} of ${fmt(rows.length)} shown`+(f.length>2000?' (first 2000 — refine to narrow)':'');
    };
    host.querySelector('#nmchips').addEventListener('click',e=>{const c=e.target.dataset.c;if(!c)return;
      cur=c;[...host.querySelectorAll('#nmchips .chip')].forEach(ch=>ch.classList.toggle('on',ch.dataset.c===c));draw();});
    const nq=host.querySelector('#nmq');
    let tmr;nq.addEventListener('input',e=>{clearTimeout(tmr);const v=e.target.value;tmr=setTimeout(()=>{q=v;draw();},200);});
    draw();
  }

  function renderCrumbs(){const c=$('#crumbs');const parts=[['Assembly',{level:'assembly',mandal:null,ward:null,booth:null}]];
    if(st.mandal)parts.push([st.mandal+' Mandala',{level:'mandala',ward:null,booth:null}]);
    if(st.ward)parts.push([st.ward+' Ward', st.level==='booth'?{level:'ward',booth:null}:null]);
    if(st.level==='booth')parts.push(['Booth '+st.booth,null]);
    c.innerHTML='';
    parts.forEach(([label,target],i)=>{if(i)c.appendChild(el('span',null,'/'));const btn=el('button',target?'':'cur',esc(label));if(target)btn.addEventListener('click',()=>go(target));c.appendChild(btn);});}
  let searchSeq=0, searchLoading=false;
  async function doSearch(raw){
    const q=raw.trim();
    if(!q){if(st.level!=='booth')render();return;}     // empty -> restore current view
    if(/^\d+$/.test(q)){go({level:'booth',mandal:null,ward:null,booth:+q});return;}
    const seq=++searchSeq, ql=q.toLowerCase();
    const wards=[],wset=new Set();
    const wsrc = BOOTHS.length ? BOOTHS : (SUMMARY?Object.entries(SUMMARY.wards).map(([w,v])=>({ward:w,mandal:v.mandal})):[]);
    for(const b of wsrc){if(b.ward.toLowerCase().includes(ql)&&!wset.has(b.ward)){wset.add(b.ward);wards.push(b);if(wards.length>=8)break;}}
    let voters=[],total=0;
    if(ql.length>=2){
      if(!ALLROWS && !searchLoading){searchLoading=true;renderSearchResults(q,{wards,voters:[],total:0,loading:true});}
      const all=await ensureAllRows(); searchLoading=false; if(seq!==searchSeq)return;
      const isEpic=/^[a-z]{2,4}\d/i.test(q);
      for(const v of all){
        if((isEpic && v._e.includes(q.toUpperCase())) || v._k.includes(ql)){
          total++; if(voters.length<80)voters.push(v);
        }
      }
    }
    if(seq!==searchSeq)return;
    renderSearchResults(q,{wards,voters,total});
  }
  function renderSearchResults(q,r){
    const wh=r.wards.map(w=>`<button class="sr" data-t="ward" data-ward="${esc(w.ward)}" data-mandal="${esc(w.mandal)}"><span><b>${esc(w.ward)}</b> ward</span><span class="dim">${esc(w.mandal)} mandala</span></button>`).join('');
    const vh=(r.voters||[]).map(v=>`<button class="sr" data-t="voter" data-booth="${v.booth}" data-epic="${esc(v.epic)}"><span><b>${esc(v.name)}</b> <span class="dim">${esc(v.epic)}</span><br><span class="dim">${esc(v.relative)} · ${esc(v.sex||'')} ${esc(v.age||'')} · ${esc(v.reason)}</span></span><span class="dim" style="text-align:right;white-space:nowrap">Booth #${v.booth}<br>Sl.No ${esc(v.serial)}</span></button>`).join('');
    const loading=r.loading;
    const none=!loading&&!r.wards.length&&!(r.voters||[]).length;
    const more=r.total>(r.voters||[]).length?` (showing first ${r.voters.length} of ${fmt(r.total)} — refine to narrow)`:'';
    $('#app').innerHTML=`<h2 class="scope">Search: &ldquo;${esc(q)}&rdquo;</h2>
      <div class="scope-meta">${loading?'searching all deleted voters…':`${r.wards.length} ward(s) · ${fmt(r.total||0)} deleted / to-be-deleted voter(s) matched${more}`}</div>
      ${r.wards.length?`<div class="sect"><h3>Wards</h3></div><div class="srlist">${wh}</div>`:''}
      ${loading?`<div class="loading">Loading the ${fmt(DATA.meta.deletedCount||318662)}-record deletion index (one-time)…</div>`:''}
      ${(r.voters||[]).length?`<div class="sect"><h3>Deleted / to-be-deleted voters</h3></div><div class="srlist">${vh}</div>`:''}
      ${none?`<div class="note">No ward or deleted voter matches &ldquo;${esc(q)}&rdquo;. You can search by voter <b>name</b>, <b>relative name</b>, <b>EPIC</b>, ward name, or booth number.</div>`:''}`;
    document.querySelectorAll('.sr').forEach(b=>b.addEventListener('click',()=>{
      const t=b.dataset.t;
      if(t==='ward')go({level:'ward',mandal:b.dataset.mandal,ward:b.dataset.ward,booth:null});
      else{if(t==='voter')pendingRosterQ=b.dataset.epic;
        go({level:'booth',mandal:null,ward:null,booth:+b.dataset.booth});}
    }));
    updateFoot();
  }

  async function loadData(){
    const inline=$('#ac174-data').textContent.trim();
    if(inline&&inline!=='null'){const d=JSON.parse(inline);BOOTHS=d.booths;return {meta:d.meta};}   // offline: full data embedded
    try{const r=await fetch(DATA_BASE+'data/summary.json',{cache:'no-store'});if(r.ok){SUMMARY=await r.json();return {meta:SUMMARY.meta};}}catch(e){}
    const r2=await fetch(DATA_BASE+'data/ac174.json',{cache:'no-store'});const d=await r2.json();BOOTHS=d.booths;return {meta:d.meta};}

  loadData().then(d=>{
    DATA=d;WARDPREZ=d.meta.wardPresident||{};
    if(hasEmbedded())ensureAllRows();   // offline: parse embedded dataset up front so search/booths are instant
    $('#title').textContent=d.meta.title;$('#subtitle').textContent=d.meta.subtitle;$('#dateBadge').textContent=d.meta.dateBadge;document.title=d.meta.subtitle;
    $('#back').addEventListener('click',()=>history.back());
    $('#mandalFilter').addEventListener('click',e=>{const f=e.target.dataset.f;if(f){st.filter=f;render();}});
    let tmr;$('#search').addEventListener('input',e=>{clearTimeout(tmr);const v=e.target.value;tmr=setTimeout(()=>doSearch(v),300);});
    window.addEventListener('hashchange',applyHash);   // browser Back/Forward + shared links
    applyHash();                                       // open whatever the URL points to (defaults to assembly)
  }).catch(err=>{$('#app').innerHTML=`<div class="err"><b>Could not load data.</b><br>${esc(err.message)}</div>`;});
})();
</script>
</body>
</html>
