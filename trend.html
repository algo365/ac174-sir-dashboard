<script>
"use strict";
(function(){
  const $=(s,r=document)=>r.querySelector(s);
  const fmt=n=>(n==null?'—':Math.round(n).toLocaleString('en-IN'));
  const p1=n=>(n==null?'—':n.toFixed(1)+'%');
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const DATA=JSON.parse($('#trend-data').textContent);
  const M=DATA.meta, DATES=M.dates;
  const st={level:'assembly',entity:null,compare:false,cmpSel:[]};

  // ---- metric getters (recompute % from counts; null-safe) ----
  const digPct=r=> r&&r.efsDigitized!=null&&r.totalElectors? 100*r.efsDigitized/r.totalElectors : null;
  const uefPct=r=> r&&r.totalUef!=null&&r.totalElectors? 100*r.totalUef/r.totalElectors : null;
  const processed=r=> r&&r.totalUef!=null&&r.efsDigitized!=null? r.efsDigitized+r.totalUef : null;
  const procPct=r=>{const p=processed(r);return p!=null&&r.totalElectors?100*p/r.totalElectors:null;};
  const pendPct=r=>{const p=procPct(r);return p!=null?100-p:null;};

  function seriesFor(level,entity){
    if(level==='assembly')return DATA.assembly;
    if(level==='mandala')return DATA.mandala[entity]||[];
    if(level==='ward')return DATA.ward[entity]||[];
    if(level==='booth')return DATA.booth[entity]||[];
    return [];
  }
  function byDate(rows){const m={};rows.forEach(r=>m[r.date]=r);return m;}
  function entitiesFor(level){
    if(level==='mandala')return Object.keys(DATA.mandala);
    if(level==='ward')return Object.keys(DATA.ward).sort((a,b)=>a.localeCompare(b));
    if(level==='booth')return Object.keys(DATA.booth).sort((a,b)=>+a-+b);
    return [];
  }
  const entLabel=(level,e)=> level==='mandala'?(M.mandalaLabels[e]||e) : level==='booth'?('Booth #'+e) : e;

  // ---- SVG line chart (multi-series, gap-aware, date x-axis, partial marker) ----
  function xscale(W,pl,pr){const ep=DATES.map(d=>Date.parse(d));const e0=Math.min(...ep),e1=Math.max(...ep);
    return d=> pl+(e1===e0?.5:(Date.parse(d)-e0)/(e1-e0))*(W-pl-pr);}
  function lineChart(series,opts){
    opts=opts||{};const W=680,H=opts.height||240,pl=48,pr=14,pt=18,pb=34;
    const x=xscale(W,pl,pr);
    let max=opts.pct?100:1;
    if(!opts.pct){series.forEach(s=>s.pts.forEach(p=>{if(p[1]!=null)max=Math.max(max,p[1]);}));
      const nice=Math.pow(10,Math.floor(Math.log10(max||1)));max=Math.ceil(max/nice)*nice||1;}
    const y=v=>H-pb-(v/max)*(H-pt-pb);
    const ticks=opts.pct?[0,25,50,75,100]:[0,.25,.5,.75,1].map(f=>Math.round(max*f));
    const grid=ticks.map(tv=>`<line x1="${pl}" y1="${y(tv)}" x2="${W-pr}" y2="${y(tv)}" stroke="#eee3d0"/><text x="${pl-6}" y="${y(tv)+3}" text-anchor="end" font-size="9" fill="#93a0b5">${opts.pct?tv+'%':fmt(tv)}</text>`).join('');
    const xt=DATES.map(d=>`<text x="${x(d)}" y="${H-pb+16}" text-anchor="middle" font-size="9.5" fill="#54607a">${d.slice(5)}</text>`).join('');
    const partial=Object.keys(M.partial).map(d=>`<line x1="${x(d)}" x2="${x(d)}" y1="${pt}" y2="${H-pb}" stroke="var(--amber)" stroke-dasharray="4 3" opacity=".7"/><text x="${x(d)}" y="${pt-5}" text-anchor="middle" font-size="8.5" font-weight="700" fill="var(--amber)">partial</text>`).join('');
    const paths=series.map(s=>{
      let segs=[],cur=[];s.pts.forEach(p=>{if(p[1]==null){if(cur.length>1)segs.push(cur);else if(cur.length===1)segs.push([cur[0],cur[0]]);cur=[];}else cur.push(p);});
      if(cur.length>1)segs.push(cur);else if(cur.length===1){const p=cur[0];segs.push([p,p]);}
      const pl2=segs.map(seg=>`<polyline points="${seg.map(p=>x(p[0])+','+y(p[1])).join(' ')}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.4}" stroke-linecap="round"/>`).join('');
      const dots=s.pts.filter(p=>p[1]!=null).map(p=>`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="3.6" fill="${s.color}"><title>${esc(s.label)} · ${p[0]}: ${opts.pct?(p[1].toFixed(1)+'%'):fmt(p[1])}</title></circle>`).join('');
      return pl2+dots;}).join('');
    const legend=series.length>1?`<div class="legend">`+series.map(s=>`<span><b style="background:${s.color}"></b>${esc(s.label)}</span>`).join('')+`</div>`:'';
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${grid}${partial}${paths}${xt}</svg>${legend}`;
  }
  const UEF_STATES=[['permShift','Permanent Shifting','var(--blue)'],['absent','Absent','var(--amber)'],
    ['death','Death','var(--red)'],['alreadyEnrolled','Already Enrolled','var(--teal)'],['others','Others','var(--ink-3)']];
  function stackedArea(rows){
    const pts=rows.filter(r=>r.permShift!=null);
    if(!pts.length)return `<div class="note">UEF state breakdown is reported only from 2026-07-30 onward.</div>`;
    const W=680,H=240,pl=48,pr=14,pt=18,pb=34,x=xscale(W,pl,pr);
    let max=1;pts.forEach(r=>{let s=0;UEF_STATES.forEach(([k])=>s+=r[k]||0);max=Math.max(max,s);});
    const nice=Math.pow(10,Math.floor(Math.log10(max)));max=Math.ceil(max/nice)*nice;
    const y=v=>H-pb-(v/max)*(H-pt-pb);
    const grid=[0,.25,.5,.75,1].map(f=>{const tv=Math.round(max*f);return `<line x1="${pl}" y1="${y(tv)}" x2="${W-pr}" y2="${y(tv)}" stroke="#eee3d0"/><text x="${pl-6}" y="${y(tv)+3}" text-anchor="end" font-size="9" fill="#93a0b5">${fmt(tv)}</text>`;}).join('');
    const xt=DATES.map(d=>`<text x="${x(d)}" y="${H-pb+16}" text-anchor="middle" font-size="9.5" fill="#54607a">${d.slice(5)}</text>`).join('');
    // cumulative layers bottom->top; Permanent Shifting at the bottom (highlighted)
    let below=pts.map(()=>0);
    const layers=UEF_STATES.map(([k,label,c],li)=>{
      const top=pts.map((r,i)=>below[i]+(r[k]||0));
      const poly=pts.map((r,i)=>x(r.date)+','+y(top[i])).join(' ')+' '+pts.slice().reverse().map((r,i)=>{const j=pts.length-1-i;return x(r.date)+','+y(below[j]);}).join(' ');
      below=top;
      const hl=k==='permShift';
      return `<polygon points="${poly}" fill="${c}" opacity="${hl?.9:.72}" stroke="${hl?c:'none'}" stroke-width="${hl?1.5:0}"/>`;
    }).join('');
    const partial=Object.keys(M.partial).map(d=>`<line x1="${x(d)}" x2="${x(d)}" y1="${pt}" y2="${H-pb}" stroke="var(--ink)" stroke-dasharray="4 3" opacity=".35"/>`).join('');
    const legend=`<div class="legend">`+UEF_STATES.map(([k,l,c])=>`<span><b style="background:${c}"></b>${l}${k==='permShift'?' (dominant)':''}</span>`).join('')+`</div>`;
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${grid}${layers}${partial}${xt}</svg>${legend}`;
  }

  // ---- delta helper ----
  function delta(cur,prev,pct,goodDown){
    if(cur==null||prev==null)return `<div class="d flat">—</div>`;
    const diff=cur-prev, good=goodDown?diff<0:diff>0;
    const cls=Math.abs(diff)<1e-9?'flat':(good?'up':'down');
    const arrow=diff>0?'▲':diff<0?'▼':'▬';
    const val=pct?Math.abs(diff).toFixed(1)+' pts':fmt(Math.abs(diff));
    return `<div class="d ${cls}">${arrow} ${val} <span style="color:var(--ink-3);font-weight:500">vs ${M.prev.slice(5)}</span></div>`;
  }

  // ---- render ----
  function render(){
    renderControls();
    const latest=M.latest, prev=M.prev;
    // partial-day banner if latest or any shown date is partial
    const partialNote=Object.keys(M.partial).length
      ? `<div class="partialbar">⚠ ${Object.entries(M.partial).map(([d,p])=>`${d} is a partial snapshot (${p.reported}/${p.total} booths reported)`).join('; ')} — the dip on that date is a coverage artefact, not a real drop.</div>`:'';

    if(st.compare){renderCompare(partialNote);return;}

    const rows=seriesFor(st.level,st.entity), bd=byDate(rows);
    const rL=bd[latest], rP=bd[prev];
    const name = st.level==='assembly'?'AC-174 Mahadevapura (Assembly)':entLabel(st.level,st.entity);
    $('#crumbs').innerHTML=`Assembly${st.level!=='assembly'?` › <b>${esc(name)}</b>`:' <b>(overall)</b>'} · latest ${latest}`;

    const kDig=digPct(rL), kPend=pendPct(rL), kUef=rL?rL.totalUef:null, kShift=rL?rL.permShift:null;
    const kpis=`<div class="kpis">
      <div class="kpi"><div class="l">SIR Submitted %</div><div class="v ${band(kDig,55,45)}">${p1(kDig)}</div>${delta(digPct(rL),digPct(rP),true,false)}</div>
      <div class="kpi"><div class="l">Pendency %</div><div class="v">${p1(kPend)}</div>${delta(pendPct(rL),pendPct(rP),true,true)}</div>
      <div class="kpi"><div class="l">Total UEF (to delete)</div><div class="v">${fmt(kUef)}</div>${delta(rL?rL.totalUef:null,rP?rP.totalUef:null,false,false)}</div>
      <div class="kpi"><div class="l">Permanent Shifting</div><div class="v" style="color:var(--blue)">${fmt(kShift)}</div>${delta(rL?rL.permShift:null,rP?rP.permShift:null,false,false)}</div>
    </div>`;

    const digCount=rows.map(r=>[r.date,r.efsDigitized]);
    const digLine=[{label:'SIR Submitted %',color:'var(--green)',pts:rows.map(r=>[r.date,digPct(r)])}];
    const procLine=[{label:'Processed %',color:'var(--navy)',pts:rows.map(r=>[r.date,procPct(r)])},
                    {label:'Pendency %',color:'var(--red)',pts:rows.map(r=>[r.date,pendPct(r)])}];
    const uefLine=[{label:'Total UEF',color:'var(--purple)',pts:rows.map(r=>[r.date,r.totalUef])}];

    const charts=`
      <div class="grid2">
        <div class="panel"><h3>SIR Submitted % over time</h3><div class="hint">EFs digitized ÷ total electors. Line starts on the first date the metric was reported; gaps = not reported.</div>${lineChart(digLine,{pct:true})}</div>
        <div class="panel"><h3>EFs Digitized (count) over time</h3><div class="hint">Absolute SIR-submitted forms per snapshot.</div>${lineChart([{label:'EFs Digitized',color:'var(--green)',pts:digCount}],{})}</div>
      </div>
      <div class="grid2">
        <div class="panel"><h3>Processed % vs Pendency %</h3><div class="hint">Processed = (SIR Submitted + Total UEF) ÷ electors. Pendency should fall over time.</div>${lineChart(procLine,{pct:true})}</div>
        <div class="panel"><h3>Total UEF (to-delete) over time</h3><div class="hint">Total flagged for deletion. Starts 2026-07-28.</div>${lineChart(uefLine,{})}</div>
      </div>
      <div class="panel" style="margin-bottom:14px"><h3>UEF deletion states — stacked (Permanent Shifting dominant)</h3>
        <div class="hint">The 5 UEF reasons stacked; reported only from 2026-07-30. Permanent Shifting is the largest driver.</div>${stackedArea(rows)}</div>`;

    $('#app').innerHTML=partialNote+kpis+charts;
    updateFoot();
  }
  const band=(v,ok,warn)=> v==null?'':(v>=ok?'up':v>=warn?'':'down');

  function renderCompare(partialNote){
    const level=st.level==='assembly'?'mandala':st.level;   // assembly has nothing to compare -> use mandala
    const ents=entitiesFor(level);
    if(!st.cmpSel.length)st.cmpSel = level==='mandala'?ents.slice():ents.slice(0,Math.min(6,ents.length));
    const palette=['var(--navy)','var(--green)','var(--red)','var(--amber)','var(--blue)','var(--purple)','var(--teal)','#b5651d'];
    const chooser=`<div class="panel" style="margin-bottom:14px"><h3>Compare ${level}s</h3>
      <div class="hint">Pick entities to overlay (SIR Submitted % and Pendency %).</div>
      <div class="cmplist">${ents.map(e=>`<label><input type="checkbox" data-e="${esc(e)}" ${st.cmpSel.includes(e)?'checked':''}>${esc(entLabel(level,e))}</label>`).join('')}</div></div>`;
    const sel=st.cmpSel.slice(0,8);
    const digS=sel.map((e,i)=>({label:entLabel(level,e),color:palette[i%palette.length],pts:seriesFor(level,e).map(r=>[r.date,digPct(r)])}));
    const penS=sel.map((e,i)=>({label:entLabel(level,e),color:palette[i%palette.length],pts:seriesFor(level,e).map(r=>[r.date,pendPct(r)])}));
    $('#crumbs').innerHTML=`Compare mode · ${level}s · latest ${M.latest}`;
    $('#app').innerHTML=partialNote+chooser+`
      <div class="grid2">
        <div class="panel"><h3>SIR Submitted % — overlay</h3><div class="hint">Higher is better.</div>${lineChart(digS,{pct:true})}</div>
        <div class="panel"><h3>Pendency % — overlay</h3><div class="hint">Lower is better.</div>${lineChart(penS,{pct:true})}</div>
      </div>`;
    document.querySelectorAll('.cmplist input').forEach(c=>c.addEventListener('change',()=>{
      const e=c.dataset.e;if(c.checked){if(!st.cmpSel.includes(e))st.cmpSel.push(e);}else st.cmpSel=st.cmpSel.filter(x=>x!==e);render();}));
    updateFoot();
  }

  function renderControls(){
    [...$('#levelSeg').children].forEach(b=>b.classList.toggle('on',b.dataset.l===st.level));
    const host=$('#pickerHost');
    if(st.compare||st.level==='assembly'){host.innerHTML='';return;}
    const level=st.level, ents=entitiesFor(level);
    if(level==='ward'){
      const byM={};ents.forEach(w=>{const m=DATA.wardMandala[w]||'?';(byM[m]=byM[m]||[]).push(w);});
      host.innerHTML=`<select id="picker">`+Object.keys(byM).map(m=>`<optgroup label="${esc(M.mandalaLabels[m]||m)}">`+byM[m].map(w=>`<option ${w===st.entity?'selected':''}>${esc(w)}</option>`).join('')+`</optgroup>`).join('')+`</select>`;
    }else if(level==='booth'){
      host.innerHTML=`<span class="picker"><input id="picker" list="boothList" placeholder="Booth # (e.g. 10)" value="${st.entity||''}"><datalist id="boothList">${ents.map(b=>`<option value="${b}">${b} · ${esc(DATA.boothMeta[b].ward)}</option>`).join('')}</datalist></span>`;
    }else{
      host.innerHTML=`<select id="picker">`+ents.map(e=>`<option value="${esc(e)}" ${e===st.entity?'selected':''}>${esc(entLabel(level,e))}</option>`).join('')+`</select>`;
    }
    const pk=$('#picker');
    if(pk)pk.addEventListener(level==='booth'?'change':'change',()=>{
      let v=pk.value.trim();
      if(level==='booth'){v=v.replace(/\D/g,'');if(!DATA.booth[v])return;}
      st.entity=v;render();
    });
  }

  function setLevel(l){
    st.level=l;
    if(l==='assembly')st.entity=null;
    else{const e=entitiesFor(l);st.entity = l==='booth'?e[0]:e[0];}
    st.cmpSel=[];render();
  }
  function updateFoot(){
    $('#foot').innerHTML=`AC-174 Mahadevapura · snapshots: ${DATES.join(' · ')} · <b>blank cells are drawn as gaps, not zero</b><br>Schema grew over time: Digitized from 07-21; Total UEF & Pendency from 07-28; UEF state breakdown from 07-30. 07-30 is a partial (505/527) snapshot.`;
  }

  // boot
  $('#subtitle').textContent=M.subtitle;$('#badge').textContent='Latest: '+M.latest;document.title=M.title;
  $('#levelSeg').addEventListener('click',e=>{const l=e.target.dataset.l;if(l)setLevel(l);});
  $('#cmpToggle').addEventListener('change',e=>{st.compare=e.target.checked;render();});
  render();
})();
</script>
</body>
</html>
